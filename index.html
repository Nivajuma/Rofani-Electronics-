<!doctype html>
<html lang="en" style="background-color: #0f172a; color: #f1f5f9;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rofani POS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <title>Rofani POS</title>
    <meta name="description" content="Rofani POS — Multi-store point of sale, inventory tracking, M-Pesa STK push, worker sales commission, expenses, and KRA tax reports." />
    <meta property="og:title" content="Rofani POS" />
    <meta property="og:description" content="Rofani POS — Multi-store point of sale, inventory tracking, M-Pesa STK push, worker sales commission, expenses, and KRA tax reports." />
  </head>
  <body style="background-color: #0f172a; color: #f1f5f9; margin: 0;">
    <div id="root">
      <div id="app-boot-splash" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#cbd5e1;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">
        <div style="font-size:16px;font-weight:700;color:#ffffff;margin-bottom:6px;">Loading Rofani POS...</div>
        <div id="app-boot-status" style="font-size:12px;color:#94a3b8;">Preparing workspace</div>
        <button id="app-boot-retry" type="button" onclick="window.__rofaniHardReload && window.__rofaniHardReload()" style="display:none;margin-top:16px;padding:10px 18px;border-radius:10px;border:1px solid #38bdf8;background:#0284c7;color:#ffffff;font-weight:700;font-size:12px;cursor:pointer;">Reload Preview</button>
      </div>
    </div>
    <script>
      (function() {
        window.__rofaniHardReload = function() {
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) regs[i].unregister();
              }).catch(function() {});
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var j = 0; j < names.length; j++) caches.delete(names[j]);
              }).catch(function() {});
            }
          } catch (e) {}
          setTimeout(function() { window.location.reload(); }, 120);
        };

        setTimeout(function() {
          var splash = document.getElementById('app-boot-splash');
          if (splash) {
            var st = document.getElementById('app-boot-status');
            var btn = document.getElementById('app-boot-retry');
            if (st) st.textContent = 'Taking longer than expected to load preview.';
            if (btn) btn.style.display = 'inline-block';
          }
        }, 9000);

        try {
          if (window.localStorage) {
            // Pre-emptively purge legacy firestore client synchronization keys
            var keysToRemove = [];
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && (k.indexOf('firestore_sequence_number_') === 0 || k.indexOf('firestore_clients_') === 0 || k.indexOf('__sak') === 0 || k.indexOf('firebase:firestore:') === 0)) {
                keysToRemove.push(k);
              }
            }
            for (var j = 0; j < keysToRemove.length; j++) {
              try { localStorage.removeItem(keysToRemove[j]); } catch(e) {}
            }
            // Strip oversized embedded image data from retail_pos_products
            var p = localStorage.getItem('retail_pos_products');
            if (p && p.indexOf('data:') !== -1) {
              try {
                var arr = JSON.parse(p);
                if (Array.isArray(arr)) {
                  var clean = arr.map(function(item) {
                    if (item && item.imageUrl && item.imageUrl.indexOf('data:') === 0) {
                      item.imageUrl = '';
                    }
                    return item;
                  });
                  localStorage.setItem('retail_pos_products', JSON.stringify(clean));
                }
              } catch(e) {}
            }
            // Auto-migrate stores to default store: Rofani POS
            var storesJson = localStorage.getItem('retail_pos_stores');
            if (storesJson && (storesJson.indexOf('Flagship') !== -1 || storesJson.indexOf('store-westlands') !== -1)) {
              try {
                var singleStore = [{
                  id: 'store-main',
                  name: 'Rofani POS',
                  code: 'HQ-CBD',
                  city: 'Nairobi',
                  address: 'Kenyatta Avenue, City Center, Nairobi',
                  phone: '+254 700 111 222',
                  isMainBranch: true,
                  active: true,
                  managerName: 'Sarah Miller'
                }];
                localStorage.setItem('retail_pos_stores', JSON.stringify(singleStore));
                localStorage.setItem('retail_pos_active_store_id', 'store-main');
              } catch(e) {}
            }
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          var host = window.location.hostname || '';
          var isDevPreview = host === 'localhost' || host === '127.0.0.1' || host.indexOf('ais-dev-') === 0;
          if (isDevPreview) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
              regs.forEach((reg) => reg.unregister());
            }).catch(() => {});
            if ('caches' in window) {
              caches.keys().then((names) => {
                names.forEach((name) => {
                  if (name.indexOf('rofani-pos-offline') === 0) caches.delete(name);
                });
              }).catch(() => {});
            }
          } else {
            navigator.serviceWorker.register('/sw.js').catch((err) => {
              console.log('SW registration skipped or failed:', err);
            });
          }
        });
      }
    </script>
  </body>
</html>
