<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <title>ROFANI ELECTRONICS AND BOUTIQUE</title>
    <meta name="description" content="Comprehensive point of sale, inventory tracking, worker sales commission engine, financing & cash in/out management, attendance, expenses, and PDF reports system." />
    <meta property="og:title" content="ROFANI ELECTRONICS AND BOUTIQUE" />
    <meta property="og:description" content="Comprehensive point of sale, inventory tracking, worker sales commission engine, financing & cash in/out management, attendance, expenses, and PDF reports system." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        try {
          if (window.localStorage) {
            // Pre-emptively purge legacy firestore client synchronization keys
            var keysToRemove = [];
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && (k.indexOf('firestore_clients_') === 0 || k.indexOf('__sak') === 0 || k.indexOf('firebase:firestore:') === 0)) {
                keysToRemove.push(k);
              }
            }
            for (var j = 0; j < keysToRemove.length; j++) {
              try { localStorage.removeItem(keysToRemove[j]); } catch(e) {}
            }
            // Strip oversized embedded image data from retail_pos_products
            var p = localStorage.getItem('retail_pos_products');
            if (p && p.indexOf('data:') !== -1) {
              try {
                var arr = JSON.parse(p);
                if (Array.isArray(arr)) {
                  var clean = arr.map(function(item) {
                    if (item && item.imageUrl && item.imageUrl.indexOf('data:') === 0) {
                      item.imageUrl = '';
                    }
                    return item;
                  });
                  localStorage.setItem('retail_pos_products', JSON.stringify(clean));
                }
              } catch(e) {}
            }
            // Auto-migrate stores to single store: Rofani Electronics
            var storesJson = localStorage.getItem('retail_pos_stores');
            if (storesJson && (storesJson.indexOf('Flagship') !== -1 || storesJson.indexOf('store-westlands') !== -1)) {
              try {
                var singleStore = [{
                  id: 'store-main',
                  name: 'Rofani Electronics',
                  code: 'HQ-CBD',
                  city: 'Nairobi',
                  address: 'Kenyatta Avenue, City Center, Nairobi',
                  phone: '+254 700 111 222',
                  isMainBranch: true,
                  active: true,
                  managerName: 'Sarah Miller'
                }];
                localStorage.setItem('retail_pos_stores', JSON.stringify(singleStore));
                localStorage.setItem('retail_pos_active_store_id', 'store-main');
              } catch(e) {}
            }
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration skipped or failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
